name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ubuntu 24.04 blocks the user namespaces Chrome's sandbox needs for the PDF export.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Build site
        run: |
          THEME="$PWD/themes/brutalist/index.js"
          mkdir -p site
          npx resumed render resume.json --theme "$THEME" --output site/index.html
          npx resumed export resume.json --theme "$THEME" --output site/Aryuth-Ekkul-CV.pdf
          node scripts/add-site-chrome.js site/index.html Aryuth-Ekkul-CV.pdf
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
